# aparat at <site>/aparat/: nginx serves the static frontend in web/ and
# proxies /aparat/api/ to the node service (server/server.js, 127.0.0.1:8001).
#
# Include this in the site's server { } block after setting $aparat_web to the
# web/ directory of the checkout:
#
#   server {
#       server_name velak.klingt.org;
#       ...
#       set $aparat_web /srv/aparat/web;
#       include /srv/aparat/nginx/aparat.conf;
#   }
#
# Everything sits inside one ^~ location, so regex locations of the rest of
# the site (caching rules for .js and the like) never take aparat's urls.

location = /aparat {
    return 301 /aparat/;
}

location ^~ /aparat/ {
    # The browser revalidates, so edited modules are never stale.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /aparat/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the API refuses presets over 1 MB itself; leave room for headers
        client_max_body_size 2m;
    }

    # /aparat/preset/<name> is the app, which loads that preset itself. The
    # page gets <base href="../"> so its relative urls (styles, modules,
    # worklet, api) resolve against /aparat/. Needs ngx_http_sub_module.
    location ~ ^/aparat/preset/[^/]+$ {
        alias $aparat_web/index.html;
        default_type text/html;
        sub_filter_once on;
        sub_filter '<head>' '<head>\n<base href="../">';
    }

    location ~ ^/aparat/(.*)$ {
        alias $aparat_web/$1;
        index index.html;
    }
}
