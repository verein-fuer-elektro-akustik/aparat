# aparat, the http-level part. In production a symlink
#   /etc/nginx/sites-enabled/aparat.conf -> /home/tong/cfg/nginx/aparat.conf
# includes it inside http { }. It cannot hold the /aparat/ locations, those
# must go into the site's server block: see aparat-locations.conf.
#
# deploy.sh fills in the web directory and the API address from deploy.env.

# the static frontend (web/ of the repository)
map $host $aparat_web {
    default @WEB_DIR@;
}

# the preset API (server/server.js)
upstream aparat_api {
    server @API@;
}
