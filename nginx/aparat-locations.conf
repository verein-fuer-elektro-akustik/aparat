# aparat at <site>/aparat/, the part inside the site's server { } block:
# serves the static frontend from $aparat_web and proxies /aparat/api/ to the
# aparat_api upstream. Both are defined at http level in aparat.conf.
#
#   server {
#       server_name velak.klingt.org;
#       ...
#       include /home/tong/cfg/nginx/aparat-locations.conf;
#   }
#
# Everything sits inside one ^~ location, so regex locations of the rest of
# the site (caching rules for .js and the like) never take aparat's urls.
# The headers are set per location because add_header in a location drops
# the ones from outer levels; the API sets its own.

location = /aparat {
    return 301 /aparat/;
}

location ^~ /aparat/ {
    location ^~ /aparat/api/ {
        proxy_pass http://aparat_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the API refuses patches over 1 MB itself; leave room for headers
        client_max_body_size 2m;
    }

    # /aparat/patch/<name> is the app, which loads that patch itself. The
    # page gets <base href="../"> so its relative urls (styles, modules,
    # worklet, api) resolve against /aparat/. Needs ngx_http_sub_module.
    location ~ ^/aparat/patch/[^/]+$ {
        alias $aparat_web/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        sub_filter_once on;
        sub_filter '<head>' '<head>\n<base href="../">';
    }

    # links from before patches were called patches
    location ~ ^/aparat/preset/([^/]+)$ {
        return 301 /aparat/patch/$1;
    }

    # the font never changes under its name, no need to ask again every time
    location ~ ^/aparat/fonts/(.*)$ {
        alias $aparat_web/fonts/$1;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/aparat/(.*)$ {
        alias $aparat_web/$1;
        index index.html;
        # the browser revalidates, so edited modules are never stale
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
