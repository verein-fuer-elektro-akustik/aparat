# Local development with the same urls as production, no root needed. From
# the repository root:
#
#   node server/server.js &               # API on 127.0.0.1:8001
#   mkdir -p data/nginx
#   nginx -p "$PWD" -c nginx/dev.conf     # http://localhost:8000/aparat/, ctrl-c stops
#
# Relative paths below resolve against the -p prefix (the repository root).

daemon off;
worker_processes 1;
pid data/nginx/nginx.pid;
error_log stderr warn;

events { worker_connections 64; }

http {
    include /etc/nginx/mime.types;
    types_hash_max_size 4096;
    default_type application/octet-stream;
    access_log off;

    client_body_temp_path data/nginx/body;
    proxy_temp_path data/nginx/proxy;
    fastcgi_temp_path data/nginx/fastcgi;
    uwsgi_temp_path data/nginx/uwsgi;
    scgi_temp_path data/nginx/scgi;

    # what aparat.conf defines in production
    map $host $aparat_web {
        default web;
    }
    upstream aparat_api {
        server 127.0.0.1:8001;
    }

    server {
        listen 127.0.0.1:8000;
        include aparat-locations.conf;

        location = / {
            return 302 /aparat/;
        }
    }
}
